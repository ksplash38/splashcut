<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>SplashCut</title>
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<div id="app">

  <!-- Home -->
  <section id="home" class="screen">
    <header class="home-top">
      <div class="logo" aria-label="SplashCut">
        <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 3c6 8 12 13 12 21a12 12 0 0 1-24 0c0-8 6-13 12-21z" fill="#c9a45c"/><path d="M13 25.5l14-8M13 17.5l14 8" stroke="#111" stroke-width="2.4" stroke-linecap="round"/></svg>
        <span>Splash<b>Cut</b></span><small class="ver">v3</small>
      </div>
      <button type="button" class="acct-chip" id="acctChip" aria-label="Account"><span class="av">◦</span><span>Sign in</span></button>
    </header>
    <button type="button" class="new-project" id="newProject">
      <span class="np-plus" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>
      <span><b>New project</b><small>Pick videos and photos to start</small></span>
    </button>
    <button type="button" class="pro-banner" id="proBanner" hidden></button>
    <div class="home-ai">
      <span class="chip-ai">AI built in</span>
      <span>Captions · Remove background · Relight · Stabilize · Auto frame · Motion tracking · Noise reduction · Split screen · 4K export</span>
    </div>
    <h2 class="home-h">Projects</h2>
    <div id="projects" class="projects"></div>
  </section>

  <!-- Editor -->
  <section id="editor" class="screen" hidden>
    <header class="ed-top">
      <button type="button" class="ibtn" id="edBack" aria-label="Back to projects">‹</button>
      <input id="projName" class="proj-name" aria-label="Project name" maxlength="40">
      <button type="button" class="ibtn" id="undo" aria-label="Undo">↶</button>
      <button type="button" class="ibtn" id="redo" aria-label="Redo">↷</button>
      <button type="button" class="export-btn" id="exportBtn"><svg class="i" viewBox="0 0 24 24"><path d="M12 15V4m0 0L7.5 8.5M12 4l4.5 4.5M5 14v5h14v-5"/></svg>Export</button>
    </header>

    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="stage-msg" id="stageMsg" hidden></div>
    </div>

    <div class="transport">
      <span class="time" id="timeNow">0:00.0</span><span class="time dim" id="timeTotal">/ 0:00.0</span>
      <div class="tmid">
        <button type="button" class="ibtn sm" id="stepBack" aria-label="Previous frame"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button type="button" class="play" id="playBtn" aria-label="Play"></button>
        <button type="button" class="ibtn sm" id="stepFwd" aria-label="Next frame"><svg class="i" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
      </div>
      <div class="zoom"><button type="button" class="ibtn sm" id="zoomOut" aria-label="Zoom out timeline">−</button><span class="zoom-lvl" id="zoomLvl" aria-live="polite">100%</span><button type="button" class="ibtn sm" id="zoomIn" aria-label="Zoom in timeline">+</button></div>
    </div>

    <div class="tl-wrap">
      <div class="tl" id="tl">
        <div class="tl-in" id="tlIn">
          <div class="ruler" id="ruler"></div>
          <div class="track t-main" id="trMain"></div>
          <div class="track t-ly" id="trLy"></div>
          <div class="track t-ov" id="trOv"></div>
          <div class="track t-au" id="trAu"></div>
          <div class="snap-line" id="snapLine" hidden><span class="snap-mag"><svg viewBox="0 0 24 24"><path d="M6 3v8a6 6 0 0 0 12 0V3h-4v8a2 2 0 0 1-4 0V3z"/><path class="tip" d="M6 3h4v3H6zM14 3h4v3h-4z"/></svg></span></div>
        </div>
      </div>
      <div class="playhead" aria-hidden="true"></div>
      <button type="button" class="tl-add" id="tlAdd" aria-label="Add videos or photos"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>

    <nav class="toolbar" id="toolbar" aria-label="Tools"></nav>
  </section>

  <!-- Bottom sheet -->
  <div class="sheet-back" id="sheetBack" hidden></div>
  <section class="sheet" id="sheet" hidden aria-modal="true" role="dialog" aria-labelledby="sheetTitle">
    <header class="sheet-h"><button type="button" class="sh-x" id="sheetCancel" aria-label="Cancel, don't apply" hidden><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button><h3 id="sheetTitle"></h3><button type="button" class="sh-all" id="sheetAll" hidden>Apply to all</button><button type="button" class="done" id="sheetDone">Done</button></header>
    <div class="sheet-b" id="sheetBody"></div>
  </section>

  <!-- Busy overlay (export, AI) -->
  <div class="busy" id="busy" hidden>
    <div class="busy-card">
      <div class="ring"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="20"/><circle id="ringFg" cx="24" cy="24" r="20" class="fg"/></svg><span id="busyPct">0%</span></div>
      <b id="busyTitle">Working</b>
      <p id="busyText"></p>
      <div class="busy-actions" id="busyActions"></div>
    </div>
  </div>

  <!-- SplashCut Pro paywall -->
  <section class="pro" id="pro" hidden aria-modal="true" role="dialog" aria-label="SplashCut Pro"></section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="fileIn" hidden>
</div>
<script src="app.js?v=5"></script>
</body>
</html>
