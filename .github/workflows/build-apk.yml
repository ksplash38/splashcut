name: Build SplashCut APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build the APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk SplashCut.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SplashCut-apk
          path: SplashCut.apk

      - name: Publish the download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest SplashCut.apk \
            --title "SplashCut (build ${{ github.run_number }})" \
            --notes "Open this page on your Android phone, tap SplashCut.apk to download it, then open the file to install." \
            --target "${{ github.sha }}"
